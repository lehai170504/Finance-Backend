# ===============================================================
# DATABASE CONFIGURATION (Supabase / Production)
# ===============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/financedb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.extract=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=trace
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# ===============================================================
# SERVER CONFIGURATION
# ===============================================================
server.port=${PORT:8080}

# DevTools for faster development
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ===============================================================
# THIRD-PARTY SERVICES
# ===============================================================

# Cloudinary - Image Hosting Service
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dlzlg8fty}
cloudinary.api-key=${CLOUDINARY_API_KEY:676549645229826}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Google OAuth2 - Social Login
google.client-id=${GOOGLE_CLIENT_ID:}

# Mail Service - Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================================================
# DOCUMENTATION & SERIALIZATION
# ===============================================================

# Swagger/OpenAPI UI Sorting
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# Jackson Date & Time Formatting (ISO 8601)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'
spring.jackson.time-zone=UTC

spring.cache.type=simple
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# ===============================================================
# CORS CONFIGURATION
# ===============================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}


